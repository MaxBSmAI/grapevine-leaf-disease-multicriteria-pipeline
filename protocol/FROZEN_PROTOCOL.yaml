protocol:
  schema_version: "1.0.0"
  protocol_version: "1.0.1"
  status: approved_for_implementation
  approval:
    approved_by: workspace_user
    approval_date: "2026-07-20"
    evidence_type: user_supplied_methodological_decisions
    evidence_sha256: 2744F85C77F8915EA504569F9129A12A4DB7D02B8B86447CA693AF6A7EE100C9
  sources:
    audit_report:
      path: 'docs/audit_report.md'
      sha256: C89AFFCEE3801903343DBB14916CF070DB4B0F8C1BA66E148D43EE4AE1DD55A6
    methodological_decisions:
      path: 'docs/methodological_decisions.md'
      sha256: 2744F85C77F8915EA504569F9129A12A4DB7D02B8B86447CA693AF6A7EE100C9
  scope:
    architectures: [resnet50, vit_b_16, swin_tiny, yolov8n_cls]
    regimes: [standard_ce, focal_loss, balanced_ce]
    input_size: [224, 224]
    input_mode: RGB
    num_classes: 4
    pretrained: false
    basic_cnn_role: optional_sanity_baseline
    confirmatory_runs: 60
    knowledge_distillation: excluded_deferred_future_work
  amendments:
    - date: "2026-08-09"
      decision: statistical_bootstrap_resamples_updated_to_5000
      authorised_by: Maximiliano Burgos
      rationale: reduce_runtime_after_empirical_parallel_diagnostic_validation
      impact: statistical_comparison_resamples_5000_workers_8_no_change_to_data_split_models_or_confirmatory_predictions
    - date: "2026-07-20"
      decision: knowledge_distillation_excluded_from_current_study
      authorised_by: Maximiliano Burgos
      impact: no_change_to_12_combinations_or_60_confirmatory_runs
  claims_excluded:
    - knowledge_distillation_results
    - field_validation
    - real_vineyard_generalisation
    - complete_phytopathological_diagnosis
    - validated_edge_deployment
    - intrinsic_interpretability
    - universal_architectural_superiority

data:
  source_dataset: DataVID - RGB
  originals_expected: 4062
  historical_augmented_files_expected: 4965
  historical_augmented_files_in_primary_experiment: false
  split_unit: group_id
  identifiers_must_not_depend_on_absolute_path: true

split:
  algorithm: grouped_stratified_candidate_optimisation
  seed: 1729
  proportions:
    train: 0.70
    validation: 0.15
    test: 0.15
  preferred_class_tolerance_percentage_points: 1.0
  maximum_class_tolerance_percentage_points: 2.0
  overall_tolerance_percentage_points: 0.5
  selection_inputs: [group_id, class_id, group_size]
  model_performance_may_select_split: false
  unresolved_multiclass_groups_block_split: true
  infeasible_tolerance_action: stop_and_report_best_mathematically_achievable_solution

normalisation:
  source_partition: train
  include_validation: false
  include_test: false
  apply_to_all_architectures_and_regimes: true

augmentation:
  common_across_regimes: true
  strong_augmentation: false
  train:
    - name: RandomResizedCrop
      size: [224, 224]
      scale: [0.85, 1.00]
      ratio: [0.90, 1.10]
      interpolation: bilinear
    - name: RandomHorizontalFlip
      probability: 0.50
    - name: RandomRotation
      degrees: 15
      interpolation: bilinear
    - name: ColorJitter
      brightness: 0.15
      contrast: 0.15
      saturation: 0.10
      hue: 0.02
    - name: ToTensor
    - name: Normalize
      mean_source: train
      std_source: train
  evaluation:
    - name: Resize
      size: [224, 224]
      interpolation: bilinear
    - name: ToTensor
    - name: Normalize
      mean_source: train
      std_source: train
  excluded:
    - vertical_flip
    - mixup
    - cutmix
    - random_erasing
    - randaugment
    - autoaugment
    - random_blur
    - regime_specific_augmentation

training_regimes:
  standard_ce:
    loss: cross_entropy
    sampler: standard_random
  focal_loss:
    loss: focal_loss
    alpha: null
    gamma_selection_partition: validation
    sampler: standard_random
  balanced_ce:
    loss: cross_entropy
    sampler: weighted_random_sampler
    replacement: true
    num_samples: train_dataset_length
    sample_weight_formula: inverse_class_frequency

tuning:
  seeds: [101, 202]
  sampler: tpe
  sampler_seed: 9001
  trials_per_architecture: 8
  max_optimizer_updates: 2500
  warmup_updates: 125
  validation_frequency_epochs: 1
  early_stopping_patience_checks: 6
  selection_metric: arithmetic_mean_validation_macro_f1_across_tuning_seeds
  test_access: false
  search_spaces:
    resnet50:
      optimizers: [AdamW, SGD]
      learning_rate:
        AdamW: [0.0001, 0.0003, 0.001]
        SGD: [0.003, 0.01, 0.03]
      weight_decay: [0.00001, 0.0001, 0.001]
      momentum:
        SGD: 0.9
    vit_b_16:
      optimizers: [AdamW]
      learning_rate: [0.00003, 0.0001, 0.0003]
      weight_decay: [0.0001, 0.001, 0.01, 0.05]
    swin_tiny:
      optimizers: [AdamW]
      learning_rate: [0.00003, 0.0001, 0.0003]
      weight_decay: [0.0001, 0.001, 0.01, 0.05]
    yolov8n_cls:
      optimizers: [AdamW, SGD]
      learning_rate:
        AdamW: [0.0001, 0.0003, 0.001]
        SGD: [0.001, 0.003, 0.01]
      weight_decay: [0.00001, 0.0001, 0.001]
      momentum:
        SGD: 0.9

focal_loss:
  alpha: null
  gamma_candidates: [0.5, 1.0, 2.0, 3.0]
  tuning_seeds: [101, 202]
  selection_tie_breaks:
    - highest_mean_validation_macro_f1
    - lowest_between_seed_standard_deviation
    - lowest_validation_loss
    - lowest_gamma

confirmatory_training:
  seeds: [42, 1337, 2025, 31415, 27182]
  batch_size: 16
  effective_batch_size: 16
  gradient_accumulation_steps: 1
  max_optimizer_updates: 6000
  warmup_updates: 300
  validation_frequency_epochs: 1
  early_stopping_patience_checks: 8
  minimum_improvement: 0.0001
  precision: fp32
  amp: false
  deterministic_level: balanced
  checkpoint_selection:
    - maximum_validation_macro_f1
    - minimum_validation_loss
    - minimum_epoch

determinism:
  level: balanced
  pythonhashseed: seeded
  cublas_workspace_config: ':4096:8'
  cudnn_benchmark: false
  cudnn_deterministic: true
  deterministic_algorithms: true
  deterministic_algorithms_warn_only: true
  persistent_workers: false
  explicit_dataloader_generator: true
  explicit_worker_initialisation: true
  explicit_weighted_sampler_generator: true
  save_rng_states: true
  bitwise_reproducibility_cross_hardware_claimed: false

evaluation:
  primary_metric: arithmetic_mean_of_seed_level_test_macro_f1
  concatenate_predictions_for_primary_metric: false
  ensemble_as_primary_result: false
  test_access_during_development: false

xai_sample:
  split: test
  images_per_class: 10
  total_images: 40
  selection_must_precede_confirmatory_predictions: true
  model_dependent_filtering: false

integrated_gradients:
  primary_target: predicted_class_logit
  secondary_target: ground_truth_class_logit
  combine_targets: false
  baseline: zero_tensor_in_normalised_space
  method: gausslegendre
  initial_steps: 64
  retry_steps: [128, 256]
  internal_batch_size: 16
  ranking_rgb_reduction: l1_sum_absolute_channels
  preserve_signed_map: true
  ranking_normalisation_required: false
  visualisation_normalisation: min_max_with_epsilon
  convergence_relative_error_threshold: 0.05
  non_convergence_action: retain_flag_and_report

perturbation:
  integrated_gradients_baseline_is_distinct: true
  baseline: gaussian_blur
  gaussian_kernel_size: 31
  gaussian_sigma: 10.0
  baseline_space: before_normalisation_with_documented_consistent_transform
  unit: non_overlapping_blocks
  block_size: 16
  block_score: mean_integrated_gradients_l1
  fraction_start: 0.0
  fraction_stop: 0.5
  fraction_step: 0.025
  points: 21
  random_trials: 20
  random_seed_derivation: image_id_plus_checkpoint_sha256_plus_method_plus_trial_number
  auc_method: normalised_trapezoidal_partial_auc
  insertion_metric_name: 'Insertion partial AUC [0, 0.5]'
  deletion_metric_name: 'Deletion partial AUC [0, 0.5]'

statistics:
  primary_metric: arithmetic_mean_of_seed_level_test_macro_f1
  bootstrap_design: crossed_paired_seed_by_group
  bootstrap_resamples: 5000
  bootstrap_seed: 424242
  confidence_level: 0.95
  alternative: two_sided
  multiple_testing_correction: holm
  predictive_and_xai_families_are_separate: true
  report_individual_seed_results: true
  mcnemar_role: complementary

profiling:
  device: cuda
  primary_precision: fp32
  secondary_precision: fp16
  execution_mode: eager
  batch_sizes: [1, 16]
  warmup_iterations: 50
  measured_iterations: 500
  independent_repetitions: 5
  timing_method: cuda_events
  synchronise_cuda: true
  input_resident_on_gpu: true
  include_data_loading: false
  inference_mode: true
  int8: false
  torch_compile: false
  primary_deployment_metric: fp32_eager_latency_batch_size_1

gates:
  current: 1
  test_unlock_gate: 9
  automatic_gate_progression: false
